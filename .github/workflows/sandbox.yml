name: SandBox

on:
  push:
  workflow_dispatch:

jobs:
  setup_python:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2025", "windows-2022", "windows-11-arm", "windows-11-vs2026-arm"]
    steps:
      - uses: actions/checkout@v7
      - name: Check python
        run: |
          set -ex
          curl -fsSLO https://www.python.org/ftp/python/pymanager/python-manager-26.3.msi
          msiexec /i "python-manager-26.3.msi" /quiet /norestart
          which -a py
          # winget install 9NQ7512CXL7T -e --accept-package-agreements --disable-interactivity
          which -a py
          py list
        shell: bash

