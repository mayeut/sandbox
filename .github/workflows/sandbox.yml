name: shell-test

on:
  push:
    branches:
      - shell-escape-space
  workflow_dispatch:
    # allow manual runs on branches without a PR

jobs:
  shell-test:
    name: shell test on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
    - uses: actions/checkout@v4
    - uses: ./
